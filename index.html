<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="이탈리아 회화">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="이탈리아 여행용 회화 카드 — 누르면 이탈리아어 발음이 나오고, 화면을 크게 보여줄 수 있어요.">
<title>이탈리아어 여행 회화 | 손끝 여행 회화</title>
<style>
  :root{
    --verde:#0f3d2e;
    --verde-2:#175a43;
    --ink:#17372c;
    --sub:#5d7f72;
    --sub-2:#7d9a8e;
    --cream:#fbf8f1;
    --ice:#eef6f1;
    --ice-2:#dcebe2;
    --terra:#c0563a;
    --line:rgba(19,58,44,.10);
    --card:#ffffff;
    --shadow:0 8px 22px rgba(19,52,40,.08);
    --shadow-s:0 4px 12px rgba(19,52,40,.07);
    --r:18px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%, #ffffff 0%, #fdfaf3 38%, #f8f1e4 70%, #f3ebdb 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(176,150,110,.20) 1.2px, transparent 1.6px),
      radial-gradient(circle, rgba(255,255,255,.95) 1.6px, transparent 2.2px);
    background-size:54px 54px, 94px 94px;
    background-position:0 0, 30px 42px;
    opacity:.7;
  }
  .app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 14px calc(var(--safe-b) + 40px)}

  /* ── 헤더 ── */
  .hero{
    position:relative;overflow:hidden;border-radius:24px;
    background:linear-gradient(140deg,#08221a 0%,#10402f 52%,#1b6b4c 100%);
    color:#fff;padding:22px 20px 18px;
    box-shadow:0 12px 28px rgba(9,40,30,.22);
  }
  .hero::after{
    content:"";position:absolute;right:-34px;top:-38px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(198,233,214,.26), rgba(120,200,170,.05) 65%, transparent 72%);
    pointer-events:none;
  }
  .tricolore{
    position:absolute;left:0;right:0;top:0;height:4px;pointer-events:none;
    background:linear-gradient(90deg,#009246 0 33.34%,#f7fbf8 33.34% 66.68%,#ce2b37 66.68% 100%);
    opacity:.92
  }
  .hero .mark{
    position:absolute;right:4px;bottom:-16px;font-size:100px;line-height:1;color:#fff;opacity:.09;
    pointer-events:none;user-select:none
  }
  .eyebrow{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:1.4px;font-weight:800;color:#a5d9c1;text-transform:uppercase}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:#7fd7ae}
  h1{margin:8px 0 0;font-size:23px;line-height:1.3;font-weight:800;letter-spacing:-.4px}
  .hero p{margin:7px 0 0;font-size:13px;line-height:1.55;color:rgba(226,246,236,.82);max-width:300px}
  .hero .tip{
    margin-top:14px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:7px 12px;font-size:11.5px;color:#ddf1e7;font-weight:600
  }

  /* ── 필터 바 ── */
  .bar{
    position:sticky;top:0;z-index:30;
    margin:0 -14px 12px;padding:9px 14px 8px;
    background:rgba(250,247,240,.88);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid rgba(19,58,44,.07);
  }
  .chips{
    display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 40px),transparent 100%);
    mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 40px),transparent 100%);
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;appearance:none;border:1px solid var(--line);background:#fff;color:#41685a;
    font:inherit;font-size:13.5px;font-weight:700;letter-spacing:-.2px;
    min-height:42px;padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(19,52,40,.04);transition:background .16s,color .16s,transform .12s,border-color .16s
  }
  .chip:active{transform:scale(.96)}
  .chip[aria-selected="true"]{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 6px 14px rgba(12,50,36,.22)}
  .subbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 0}
  .count{font-size:11.5px;font-weight:700;color:var(--sub-2);letter-spacing:.2px}
  .favbtn{
    appearance:none;border:1px solid var(--line);background:#fff;color:#41685a;font:inherit;
    font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;transition:all .16s
  }
  .favbtn .s{font-size:14px;line-height:1;color:#c3d6cb}
  .favbtn[aria-pressed="true"]{background:linear-gradient(180deg,#ffd88a,#f6bd5c);border-color:#efb54e;color:#66450c;box-shadow:0 6px 14px rgba(220,160,40,.28)}
  .favbtn[aria-pressed="true"] .s{color:#8a5d0a}

  /* ── 카드 ── */
  .list{display:grid;gap:11px}
  .card{
    position:relative;background:var(--card);border:1px solid rgba(19,58,44,.07);
    border-radius:var(--r);padding:14px 15px 14px;box-shadow:var(--shadow);
    animation:rise .28s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:42px}
  .tag{
    font-size:11px;font-weight:800;letter-spacing:.1px;padding:4px 9px;border-radius:7px;
    background:var(--ice);color:#3f6f5c;white-space:nowrap
  }
  .tag[data-cat="air"]{background:#e6f1fd;color:#2f6796}
  .tag[data-cat="hotel"]{background:#efeafa;color:#5a4a8f}
  .tag[data-cat="food"]{background:#fdf0e4;color:#95642f}
  .tag[data-cat="shop"]{background:#e8f5ef;color:#2f7a5c}
  .tag[data-cat="help"]{background:#fdeceb;color:#a4534b}
  .star{
    position:absolute;right:9px;top:9px;width:42px;height:42px;border:0;background:transparent;
    font-size:21px;line-height:1;color:#b7cdc2;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;transition:transform .14s,color .14s;
    -webkit-user-select:none;user-select:none
  }
  .star:active{transform:scale(.86)}
  .star[aria-pressed="true"]{color:#f5b53f;text-shadow:0 2px 6px rgba(230,165,40,.35)}
  .ko{margin:9px 0 0;font-size:16.5px;font-weight:750;letter-spacing:-.3px;line-height:1.4;color:var(--ink)}
  .it{
    margin:9px 0 0;font-size:19px;font-weight:600;line-height:1.5;color:#12392c;letter-spacing:.1px;
    font-family:"Iowan Old Style",Georgia,"Palatino Linotype","Times New Roman",serif;
    word-break:keep-all;overflow-wrap:anywhere
  }
  .rom{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--sub);letter-spacing:.1px}
  .hint{margin:7px 0 0;font-size:12px;line-height:1.55;color:var(--sub-2)}
  .hint::before{content:"TIP ";font-weight:800;font-size:10px;letter-spacing:.6px;color:#a9c1b5}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
  .btn{
    appearance:none;border:0;font:inherit;border-radius:13px;height:48px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:14.5px;font-weight:800;letter-spacing:-.2px;transition:transform .12s,filter .16s;
    -webkit-user-select:none;user-select:none
  }
  .btn:active{transform:scale(.97)}
  .say{background:linear-gradient(180deg,#1c6b4d,#0e3f2d);color:#fff;box-shadow:0 6px 14px rgba(12,52,38,.22)}
  .say.playing{background:linear-gradient(180deg,#2f9a6f,#176344);box-shadow:0 0 0 3px rgba(126,214,174,.35),0 6px 14px rgba(12,52,38,.22)}
  .big{background:#eef6f1;color:#154035;border:1px solid #cfe6d9}
  .empty{
    text-align:center;padding:44px 20px;background:#fff;border:1px dashed #cfe0d5;border-radius:var(--r);
    color:var(--sub);font-size:13.5px;line-height:1.7
  }
  .empty .e-ico{display:block;font-size:30px;margin-bottom:8px;color:#e2b660}

  footer{margin:22px 4px 0;font-size:11.5px;line-height:1.75;color:var(--sub-2);text-align:center}
  footer b{color:#5d7f72;font-weight:800}

  /* ── 크게 보기 모달 ── */
  .modal{
    position:fixed;inset:0;z-index:100;display:none;flex-direction:column;
    background:linear-gradient(160deg,#061a12 0%,#0d3527 55%,#12503a 100%);
    color:#fff;padding:calc(var(--safe-t) + 8px) 0 calc(var(--safe-b) + 14px);
  }
  .modal.open{display:flex;animation:fade .18s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .m-top{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 0;gap:10px}
  .m-label{font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:#8fc7ac;text-transform:uppercase}
  .m-close{
    width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.10);color:#fff;font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center
  }
  .m-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px;overflow-y:auto}
  .m-it{
    font-family:"Iowan Old Style",Georgia,"Palatino Linotype","Times New Roman",serif;
    font-size:clamp(28px,8.4vw,62px);line-height:1.32;font-weight:700;letter-spacing:.005em;
    word-break:keep-all;overflow-wrap:anywhere;text-shadow:0 4px 18px rgba(0,0,0,.25)
  }
  .m-it.len-s{font-size:clamp(40px,14vw,100px);line-height:1.24}
  .m-it.len-m{font-size:clamp(32px,10.6vw,78px);line-height:1.3}
  .m-it.len-l{font-size:clamp(26px,8vw,58px);line-height:1.36}
  .m-rom{margin-top:20px;font-size:clamp(15px,4.4vw,21px);line-height:1.5;color:#bfe3d1;font-weight:600}
  .m-ko{margin-top:10px;font-size:13.5px;line-height:1.5;color:#87b09c}
  .m-say{
    margin-top:26px;appearance:none;border:0;border-radius:16px;height:56px;padding:0 26px;
    background:#eef8f2;color:#0f3d2e;font:inherit;font-size:15.5px;font-weight:800;
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25)
  }
  .m-say:active{transform:scale(.97)}
  .m-foot{text-align:center;font-size:11.5px;color:#80a894;padding:10px 16px 0}

  .toast{
    position:fixed;left:50%;bottom:calc(var(--safe-b) + 22px);transform:translate(-50%,14px);
    background:rgba(10,36,26,.94);color:#eafaf1;font-size:12.5px;font-weight:600;
    padding:11px 16px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;max-width:88vw;text-align:center
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:460px){
    h1{font-size:25px}
    .it{font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <span class="tricolore" aria-hidden="true"></span>
    <div class="eyebrow"><span class="dot"></span>이탈리아 · 로마 · 피렌체 · 밀라노</div>
    <h1>눌러서 듣는<br>이탈리아어 회화 카드</h1>
    <p>말이 안 나올 때, 화면을 보여주면 통합니다. 🔊로 발음을 듣고 👀로 크게 띄워 보여주세요.</p>
    <span class="tip">☕ 에스프레소처럼 짧고 또렷하게</span>
    <span class="mark" aria-hidden="true">🏛</span>
  </header>

  <div class="bar">
    <div class="chips" id="chips" role="tablist" aria-label="상황별 분류"></div>
    <div class="subbar">
      <span class="count" id="count"></span>
      <button class="favbtn" id="favOnly" type="button" aria-pressed="false"><span class="s">★</span>자주 쓰는 문장만</button>
    </div>
  </div>

  <main class="list" id="list" aria-live="polite"></main>

  <footer>
    <b>발음 안내</b> · 한글 표기는 최대한 비슷하게 적은 것이라 실제 발음과 조금 다를 수 있어요.<br>
    🔊 버튼을 누르면 기기의 이탈리아어 음성으로 읽어 줍니다. (음성이 안 나오면 무음 모드를 확인해 주세요.)
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mLabel" hidden>
  <div class="m-top">
    <span class="m-label" id="mLabel">화면 보여주기</span>
    <button class="m-close" id="mClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="m-body">
    <div class="m-it" id="mIt" lang="it"></div>
    <div class="m-rom" id="mRom"></div>
    <div class="m-ko" id="mKo"></div>
    <button class="m-say" id="mSay" type="button">🔊 다시 듣기</button>
  </div>
  <div class="m-foot">상대방에게 이 화면을 보여주세요</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var CATS = [
    { id: "all",   name: "전체" },
    { id: "air",   name: "공항·교통" },
    { id: "hotel", name: "호텔" },
    { id: "food",  name: "식당·카페" },
    { id: "shop",  name: "쇼핑" },
    { id: "help",  name: "도움·긴급" }
  ];

  var PHRASES = [
    /* ── 공항·교통 ── */
    { id: "air1", cat: "air", ko: "공항버스 타는 곳이 어디예요?", it: "Dov'è la fermata dell'autobus per l'aeroporto?", rom: "도베 라 페르마타 델라우토부스 페르 라에로포르토", hint: "공항 직원에게 물으면 손가락으로 위치를 짚어 줍니다." },
    { id: "air2", cat: "air", ko: "레오나르도 익스프레스 표는 어디서 사요?", it: "Dove posso comprare il biglietto del Leonardo Express?", rom: "도베 포소 콤프라레 일 빌리에토 델 레오나르도 익스프레스", hint: "피우미치노 공항에서 테르미니역까지 논스톱. 자동발매기나 창구에서 사요." },
    { id: "air3", cat: "air", ko: "이 기차 테르미니역에 가나요?", it: "Questo treno va a Termini?", rom: "쿠에스토 트레노 바 아 테르미니", hint: "타기 전에 승강장 전광판의 행선지를 한 번 더 확인하세요." },
    { id: "air4", cat: "air", ko: "몇 번 승강장에서 출발해요?", it: "Da quale binario parte?", rom: "다 쿠알레 비나리오 파르테", hint: "승강장은 'Binario'. 표에는 보통 번호가 없고 전광판에서 확인해요." },
    { id: "air5", cat: "air", ko: "표는 어디서 검표(날인)해요?", it: "Dove devo convalidare il biglietto?", rom: "도베 데보 콘발리다레 일 빌리에토", hint: "이탈리아 기차는 타기 전 승강장 기계에 표를 넣어 날인해야 해요. 안 하면 벌금이 붙어요." },
    { id: "air6", cat: "air", ko: "이 버스 시내 중심에 가나요?", it: "Questo autobus va in centro?", rom: "쿠에스토 아우토부스 바 인 첸트로", hint: "로마 시내는 'centro storico'. 방향이 반대면 맞은편 정류장을 쓰세요." },
    { id: "air7", cat: "air", ko: "콜로세오까지 얼마예요?", it: "Quanto costa fino al Colosseo?", rom: "쿠안토 코스타 피노 알 콜로세오", hint: "택시는 타기 전에 흥정하지 말고 미터기를 켜 달라고 하세요." },
    { id: "air8", cat: "air", ko: "표 한 장 주세요", it: "Un biglietto, per favore.", rom: "운 빌리에토, 페르 파보레", hint: "왕복은 andata e ritorno. '편도'는 solo andata예요." },
    { id: "air9", cat: "air", ko: "몇 정류장 남았어요?", it: "Quante fermate mancano?", rom: "쿠안테 페르마테 만카노", hint: "'fermata'가 정류장·정거장이에요." },
    { id: "air10", cat: "air", ko: "다음 정류장에서 내릴게요", it: "Devo scendere alla prossima fermata.", rom: "데보 셴데레 알라 프로시마 페르마타", hint: "버스 문 옆 빨간 STOP 버튼을 누르거나 기사에게 말해요." },
    { id: "air11", cat: "air", ko: "걸어서 갈 수 있나요?", it: "Si può andare a piedi?", rom: "시 푸오 안다레 아 피에디", hint: "로마·피렌체 구시가는 골목이 좁아 도보가 더 빠를 때가 많아요." },
    { id: "air12", cat: "air", ko: "택시 정류장이 어디예요?", it: "Dov'è la stazione dei taxi?", rom: "도베 라 스타치오네 데이 탁시", hint: "길에서 잡지 말고 정식 승강장에서 타면 바가지가 없어요." },

    /* ── 호텔 ── */

  ];

  var CAT_NAME = {};
  CATS.forEach(function (c) { CAT_NAME[c.id] = c.name; });

  var LS_KEY = "italy-phrases-fav-v1";
  var state = { cat: "all", favOnly: false, favs: loadFavs() };

  var els = {
    chips: document.getElementById("chips"),
    list: document.getElementById("list"),
    count: document.getElementById("count"),
    favOnly: document.getElementById("favOnly"),
    modal: document.getElementById("modal"),
    mIt: document.getElementById("mIt"),
    mRom: document.getElementById("mRom"),
    mKo: document.getElementById("mKo"),
    mSay: document.getElementById("mSay"),
    mClose: document.getElementById("mClose"),
    toast: document.getElementById("toast")
  };

  /* ── 즐겨찾기 저장 ── */
  function loadFavs() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (v) { return typeof v === "string"; }) : [];
    } catch (e) { return []; }
  }
  function saveFavs() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state.favs)); } catch (e) { /* 저장 불가(사생활 모드 등) */ }
  }
  function isFav(id) { return state.favs.indexOf(id) !== -1; }
  function toggleFav(id) {
    var i = state.favs.indexOf(id);
    if (i === -1) state.favs.push(id); else state.favs.splice(i, 1);
    saveFavs();
  }

  /* ── 음성 재생 ── */
  var synth = window.speechSynthesis || null;
  var itVoice = null;
  var speakSeq = 0;
  var activeSayBtn = null;
  var watchdog = null;

  function pickItVoice() {
    if (!synth || !synth.getVoices) return null;
    var voices = synth.getVoices() || [];
    var it = voices.filter(function (v) { return /^it/i.test(v.lang || ""); });
    if (!it.length) return null;
    return it.filter(function (v) { return /Alice|Luca|Elsa|Diego|Isotta|Federica|Google/i.test(v.name || ""); })[0]
      || it.filter(function (v) { return v.localService; })[0]
      || it[0];
  }
  if (synth) {
    itVoice = pickItVoice();
    if (typeof synth.addEventListener === "function") {
      synth.addEventListener("voiceschanged", function () { itVoice = pickItVoice(); });
    } else {
      synth.onvoiceschanged = function () { itVoice = pickItVoice(); };
    }
  }

  function resetSayBtn() {
    if (activeSayBtn) {
      activeSayBtn.classList.remove("playing");
      activeSayBtn.textContent = "🔊 듣기";
      activeSayBtn = null;
    }
  }

  function stopSpeech() {
    speakSeq++;
    if (watchdog) { clearTimeout(watchdog); watchdog = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    resetSayBtn();
  }

  function speak(text, btn) {
    if (!synth) { toast("이 브라우저는 음성 재생을 지원하지 않아요. 발음 가이드를 봐 주세요."); return; }

    if (btn && activeSayBtn === btn) { stopSpeech(); return; }

    var seq = ++speakSeq;
    if (watchdog) { clearTimeout(watchdog); watchdog = null; }
    resetSayBtn();
    try { synth.cancel(); } catch (e) {}

    var u = new SpeechSynthesisUtterance(text);
    u.lang = "it-IT";
    u.rate = 0.85;
    u.pitch = 1;
    u.volume = 1;
    if (!itVoice) itVoice = pickItVoice();
    if (itVoice) u.voice = itVoice;

    function finish() {
      if (seq !== speakSeq) return;
      if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      resetSayBtn();
    }
    u.onend = finish;
    u.onerror = finish;

    if (btn) {
      activeSayBtn = btn;
      btn.classList.add("playing");
      btn.textContent = "⏸ 재생 중";
    }

    /* iOS Safari: 클릭 핸들러 안에서 곧바로 speak()를 호출해야 소리가 나요. */
    try { synth.speak(u); } catch (e) { resetSayBtn(); }
    if (synth.paused) { try { synth.resume(); } catch (e) {} }

    /* onend가 오지 않는 기기 대비 안전장치 */
    watchdog = setTimeout(finish, 1400 + text.length * 130);
  }

  /* ── 토스트 ── */
  var toastTimer = null;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove("show"); }, 2400);
  }

  /* ── 목록 그리기 ── */
  function filtered() {
    return PHRASES.filter(function (p) {
      if (state.favOnly && !isFav(p.id)) return false;
      if (state.cat !== "all" && p.cat !== state.cat) return false;
      return true;
    });
  }

  function cardHTML(p) {
    var fav = isFav(p.id);
    return '' +
      '<article class="card" data-id="' + p.id + '">' +
        '<div class="top"><span class="tag" data-cat="' + p.cat + '">' + CAT_NAME[p.cat] + '</span></div>' +
        '<button class="star" type="button" data-star="' + p.id + '" aria-pressed="' + (fav ? "true" : "false") + '" ' +
          'aria-label="' + (fav ? "즐겨찾기 해제" : "즐겨찾기에 추가") + '">' + (fav ? "★" : "☆") + '</button>' +
        '<p class="ko">' + p.ko + '</p>' +
        '<p class="it" lang="it">' + p.it + '</p>' +
        '<p class="rom">' + p.rom + '</p>' +
        (p.hint ? '<p class="hint">' + p.hint + '</p>' : '') +
        '<div class="row">' +
          '<button class="btn say" type="button" data-say="' + p.id + '">🔊 듣기</button>' +
          '<button class="btn big" type="button" data-big="' + p.id + '">👀 크게 보기</button>' +
        '</div>' +
      '</article>';
  }

  function byId(id) {
    for (var i = 0; i < PHRASES.length; i++) if (PHRASES[i].id === id) return PHRASES[i];
    return null;
  }

  function render() {
    var items = filtered();

    if (!items.length) {
      els.list.innerHTML = '<div class="empty"><span class="e-ico">★</span>' +
        (state.favOnly ? "아직 즐겨찾기한 문장이 없어요.<br>카드 오른쪽 ☆을 눌러 모아 두세요."
                       : "이 분류에는 문장이 없어요.") + '</div>';
    } else {
      els.list.innerHTML = items.map(cardHTML).join("");
    }

    els.count.textContent = state.favOnly
      ? "즐겨찾기 " + items.length + "개"
      : "문장 " + items.length + "개";

    /* 이벤트 연결 (클릭 핸들러 안에서 바로 발화) */
    var sayBtns = els.list.querySelectorAll("[data-say]");
    for (var i = 0; i < sayBtns.length; i++) {
      sayBtns[i].addEventListener("click", function () {
        var p = byId(this.getAttribute("data-say"));
        if (p) speak(p.it, this);
      });
    }
    var bigBtns = els.list.querySelectorAll("[data-big]");
    for (var j = 0; j < bigBtns.length; j++) {
      bigBtns[j].addEventListener("click", function () {
        openModal(this.getAttribute("data-big"));
      });
    }
    var stars = els.list.querySelectorAll("[data-star]");
    for (var k = 0; k < stars.length; k++) {
      stars[k].addEventListener("click", function () {
        var id = this.getAttribute("data-star");
        toggleFav(id);
        var on = isFav(id);
        this.setAttribute("aria-pressed", on ? "true" : "false");
        this.setAttribute("aria-label", on ? "즐겨찾기 해제" : "즐겨찾기에 추가");
        this.textContent = on ? "★" : "☆";
        if (state.favOnly) render();
        else els.count.textContent = "문장 " + filtered().length + "개";
      });
    }

    /* 재생 중이던 버튼이 사라졌으면 정리 */
    if (activeSayBtn && !document.body.contains(activeSayBtn)) {
      activeSayBtn = null;
    }
  }

  function renderChips() {
    els.chips.innerHTML = CATS.map(function (c) {
      return '<button class="chip" type="button" role="tab" data-cat="' + c.id + '" aria-selected="' +
        (state.cat === c.id ? "true" : "false") + '">' + c.name + '</button>';
    }).join("");
    var chips = els.chips.querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function () {
        state.cat = this.getAttribute("data-cat");
        var all = els.chips.querySelectorAll(".chip");
        for (var n = 0; n < all.length; n++) {
          all[n].setAttribute("aria-selected", all[n] === this ? "true" : "false");
        }
        stopSpeech();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  }

  /* ── 크게 보기 모달 ── */
  var lastFocus = null;
  var modalPhrase = null;

  function openModal(id) {
    var p = byId(id);
    if (!p) return;
    modalPhrase = p;
    lastFocus = document.activeElement;
    els.mIt.textContent = p.it;
    var n = p.it.length;
    els.mIt.className = "m-it" + (n <= 14 ? " len-s" : n <= 24 ? " len-m" : n <= 36 ? " len-l" : "");
    els.mRom.textContent = p.rom;
    els.mKo.textContent = p.ko;
    els.modal.hidden = false;
    els.modal.classList.add("open");
    document.body.style.overflow = "hidden";
    els.mSay.textContent = "🔊 다시 듣기";
    try { els.mClose.focus({ preventScroll: true }); } catch (e) { els.mClose.focus(); }
  }

  function closeModal() {
    if (!modalPhrase) return;
    stopSpeech();
    els.modal.classList.remove("open");
    els.modal.hidden = true;
    document.body.style.overflow = "";
    modalPhrase = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }

  els.mClose.addEventListener("click", closeModal);
  els.modal.addEventListener("click", function (e) {
    if (e.target === els.modal) closeModal();
  });
  els.mSay.addEventListener("click", function () {
    if (modalPhrase) speak(modalPhrase.it, null);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modalPhrase) closeModal();
  });

  /* ── 즐겨찾기 토글 ── */
  els.favOnly.addEventListener("click", function () {
    state.favOnly = !state.favOnly;
    this.setAttribute("aria-pressed", state.favOnly ? "true" : "false");
    stopSpeech();
    render();
  });

  /* ── 화면이 가려지면 소리 정지 ── */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopSpeech();
  });

  renderChips();
  render();
})();
</script>
</body>
</html>
